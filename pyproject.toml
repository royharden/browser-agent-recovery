[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-recovery-lab"
version = "0.1.0"
description = "Source-only development foundation for visible-state browser recovery"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rlab = "rlab.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["rlab*"]
exclude = [
    "rlab.evaluation", "rlab.evaluation.*",
    "rlab.heldout", "rlab.heldout.*",
    "rlab.held_out", "rlab.held_out.*",
]
